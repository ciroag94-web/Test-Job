<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search Results</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #111827;
      color: white;
      padding: 36px 5%;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #cbd5e1; }
    .layout {
      max-width: 1400px;
      margin: auto;
      padding: 28px 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }
    .filters, .results {
      background: var(--card);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
    }
    .filters { height: fit-content; }
    h2 { margin-top: 0; }
    .group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }
    button {
      width: 100%;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .apply { background: var(--primary); color: white; }
    .apply:hover { background: var(--primary-dark); }
    .reset { background: #eef2f7; color: var(--text); }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    #count { color: var(--muted); }
    .job-list { display: grid; gap: 14px; }
    .job {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    .job-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    .job h3 { margin: 0 0 6px; }
    .company { margin: 0; color: var(--muted); }
    .badge {
      background: #eff6ff;
      color: #1d4ed8;
      padding: 7px 10px;
      border-radius: 999px;
      height: fit-content;
      font-size: 12px;
      font-weight: bold;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }
    .tag {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>Job Search</h1>
  <p>Search opportunities using location, company size, sector and position filters.</p>
</header>

<div class="layout">
  <aside class="filters">
    <h2>Filters</h2>

    <div class="group">
      <label for="location">Location</label>
      <select id="location">
        <option value="">All locations</option>
        <option value="Italy">Italy</option>
        <option value="Germany">Germany</option>
        <option value="Netherlands">Netherlands</option>
        <option value="Spain">Spain</option>
        <option value="Remote">Remote</option>
      </select>
    </div>

    <div class="group">
      <label for="size">Company size</label>
      <select id="size">
        <option value="">All sizes</option>
        <option value="Startup">Startup (1-50)</option>
        <option value="Small">Small (51-200)</option>
        <option value="Medium">Medium (201-1000)</option>
        <option value="Large">Large (1000+)</option>
      </select>
    </div>

    <div class="group">
      <label for="sector">Main sector</label>
      <select id="sector">
        <option value="">All sectors</option>
        <option value="Fintech">Fintech</option>
        <option value="Banking">Banking</option>
        <option value="Compliance">Compliance</option>
        <option value="Financial Services">Financial Services</option>
        <option value="Crypto">Crypto / Digital Assets</option>
        <option value="Technology">Technology</option>
      </select>
    </div>

    <div class="group">
      <label for="position">Position name</label>
      <input id="position" type="text" placeholder="e.g. Compliance Officer">
    </div>

    <button class="apply" onclick="applyFilters()">Apply filters</button>
    <button class="reset" onclick="resetFilters()">Reset filters</button>
  </aside>

  <main class="results">
    <div class="top">
      <h2>Job Results</h2>
      <span id="count"></span>
    </div>
    <div id="jobs" class="job-list"></div>
  </main>
</div>

<script>
const jobs = [
  {title:"Senior AML Compliance Officer", company:"Example Bank", location:"Germany", size:"Large", sector:"Banking", description:"Lead AML and financial crime compliance activities."},
  {title:"Financial Crime Manager", company:"Fintech Europe", location:"Netherlands", size:"Medium", sector:"Fintech", description:"Manage transaction monitoring and financial crime risk."},
  {title:"Compliance Officer", company:"Digital Finance", location:"Italy", size:"Small", sector:"Financial Services", description:"Support regulatory compliance and internal controls."},
  {title:"Crypto Compliance Specialist", company:"Digital Assets Co.", location:"Spain", size:"Startup", sector:"Crypto", description:"Develop compliance controls for digital asset products."},
  {title:"AML Manager", company:"Remote Fintech", location:"Remote", size:"Medium", sector:"Fintech", description:"Manage AML operations and transaction monitoring."}
];

function renderJobs(items) {
  const container = document.getElementById("jobs");
  document.getElementById("count").textContent = `${items.length} job${items.length === 1 ? "" : "s"} found`;

  if (!items.length) {
    container.innerHTML = '<div class="empty">No jobs match your filters.</div>';
    return;
  }

  container.innerHTML = items.map(job => `
    <article class="job">
      <div class="job-head">
        <div>
          <h3>${job.title}</h3>
          <p class="company">${job.company}</p>
        </div>
        <span class="badge">${job.location}</span>
      </div>
      <div class="meta">
        <span class="tag">📍 ${job.location}</span>
        <span class="tag">🏢 ${job.size}</span>
        <span class="tag">🏷️ ${job.sector}</span>
      </div>
      <p>${job.description}</p>
    </article>
  `).join("");
}

function applyFilters() {
  const location = document.getElementById("location").value;
  const size = document.getElementById("size").value;
  const sector = document.getElementById("sector").value;
  const position = document.getElementById("position").value.trim().toLowerCase();

  const filtered = jobs.filter(job =>
    (!location || job.location === location) &&
    (!size || job.size === size) &&
    (!sector || job.sector === sector) &&
    (!position || job.title.toLowerCase().includes(position))
  );

  renderJobs(filtered);
}

function resetFilters() {
  document.getElementById("location").value = "";
  document.getElementById("size").value = "";
  document.getElementById("sector").value = "";
  document.getElementById("position").value = "";
  renderJobs(jobs);
}

document.getElementById("position").addEventListener("keydown", event => {
  if (event.key === "Enter") applyFilters();
});

renderJobs(jobs);
</script>
</body>
</html>

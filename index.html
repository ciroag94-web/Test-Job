<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search Results</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #182230;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --chip: #eff6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 5%;
    }

    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; color: #cbd5e1; }

    .layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    .filters, .results-panel {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
    }

    .filters {
      padding: 22px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .filters h2 { margin-top: 0; font-size: 20px; }

    .filter-group { margin: 0 0 22px; }

    .filter-group label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--primary);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .search-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .search-btn:hover { background: var(--primary-dark); }

    .reset-btn {
      width: 100%;
      background: #f3f4f6;
      color: var(--text);
    }

    .results-panel { padding: 26px; }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
    }

    .results-header h2 { margin: 0; }

    .count { color: var(--muted); font-size: 14px; }

    .job-list {
      display: grid;
      gap: 14px;
    }

    .job-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      transition: .2s ease;
    }

    .job-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 6px 20px rgba(37, 99, 235, .08);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .job-title {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .company {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .badge {
      background: var(--chip);
      color: var(--primary-dark);
      padding: 6px 10px;
      border-radius: 999px;
      height: fit-content;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }

    .meta {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: #475569;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .filters { position: static; }
    }
  </style>
</head>
<body>

<header>
  <h1>Job Search</h1>
  <p>Find and filter opportunities by location, company size, sector and position.</p>
</header>

<div class="layout">
  <aside class="filters">
    <h2>Filters</h2>

    <div class="filter-group">
      <label for="location">Location</label>
      <select id="location">
        <option value="">All locations</option>
        <option value="Italy">Italy</option>
        <option value="Germany">Germany</option>
        <option value="Netherlands">Netherlands</option>
        <option value="Spain">Spain</option>
        <option value="Remote">Remote</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="companySize">Company size</label>
      <select id="companySize">
        <option value="">All sizes</option>
        <option value="Startup">Startup (1-50)</option>
        <option value="Small">Small (51-200)</option>
        <option value="Medium">Medium (201-1000)</option>
        <option value="Large">Large (1000+)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="sector">Main sector</label>
      <select id="sector">
        <option value="">All sectors</option>
        <option value="Fintech">Fintech</option>
        <option value="Banking">Banking</option>
        <option value="Compliance">Compliance</option>
        <option value="Financial Services">Financial Services</option>
        <option value="Crypto">Crypto / Digital Assets</option>
        <option value="Technology">Technology</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="position">Position name</label>
      <input id="position" type="text" placeholder="e.g. Compliance Officer">
    </div>

    <button class="search-btn" onclick="applyFilters()">Apply filters</button>
    <button class="reset-btn" onclick="resetFilters()">Reset filters</button>
  </aside>

  <main class="results-panel">
    <div class="results-header">
      <div>
        <h2>Job Results</h2>
        <div class="count" id="count"></div>
      </div>
    </div>

    <section class="job-list" id="jobList"></section>
  </main>
</div>

<script>
const jobs = [
  {
    title: "Senior AML Compliance Officer",
    company: "Example Bank",
    location: "Germany",
    size: "Large",
    sector: "Banking",
    description: "Lead AML and financial crime compliance activities."
  },
  {
    title: "Financial Crime Manager",
    company: "Fintech Europe",
    location: "Netherlands",
    size: "Medium",
    sector: "Fintech",
    description: "Manage transaction monitoring and financial crime risk."
  },
  {
    title: "Compliance Officer",
    company: "Digital Finance",
    location: "Italy",
    size: "Small",
    sector: "Financial Services",
    description: "Support regulatory compliance and internal controls."
  },
  {
    title: "Crypto Compliance Specialist",
    company: "Digital Assets Co.",
    location: "Spain",
    size: "Startup",
    sector: "Crypto",
    description: "Develop compliance controls for digital asset products."
  },
  {
    title: "AML Manager",
    company: "Remote Fintech",
    location: "Remote",
    size: "Medium",
    sector: "Fintech",
    description: "Manage AML operations and transaction monitoring."
  }
];

function renderJobs(items) {
  const list = document.getElementById("jobList");
  const count = document.getElementById("count");

  count.textContent = `${items.length} job${items.length === 1 ? "" : "s"} found`;

  if (!items.length) {
    list.innerHTML = `<div class="empty">No jobs match your current filters.</div>`;
    return;
  }

  list.innerHTML = items.map(job => `
    <article class="job-card">
      <div class="job-top">
        <div>
          <h3 class="job-title">${job.title}</h3>
          <p class="company">${job.company}</p>
        </div>
        <span class="badge">${job.location}</span>
      </div>

      <div class="job-meta">
        <span class="meta">📍 ${job.location}</span>
        <span class="meta">🏢 ${job.size}</span>
        <span class="meta">🏷️ ${job.sector}</span>
      </div>

      <p>${job.description}</p>
    </article>
  `).join("");
}

function applyFilters() {
  const location = document.getElementById("location").value;
  const size = document.getElementById("companySize").value;
  const sector = document.getElementById("sector").value;
  const position = document.getElementById("position").value.trim().toLowerCase();

  const filtered = jobs.filter(job => {
    const locationMatch = !location || job.location === location;
    const sizeMatch = !size || job.size === size;
    const sectorMatch = !sector || job.sector === sector;
    const positionMatch = !position || job.title.toLowerCase().includes(position);

    return locationMatch && sizeMatch && sectorMatch && positionMatch;
  });

  renderJobs(filtered);
}

function resetFilters() {
  document.getElementById("location").value = "";
  document.getElementById("companySize").value = "";
  document.getElementById("sector").value = "";
  document.getElementById("position").value = "";
  renderJobs(jobs);
}

renderJobs(jobs);
</script>

</body>
</html>
